          in: query
          schema: { $ref: '#/components/schemas/SourceCode' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de lotes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Imports]
      operationId: uploadImport
      summary: IM-02 Sube un archivo de una fuente oficial (M)
      description: Queda en aterrizaje; las diferencias se calculan en segundo plano (Received → Parsing → ReadyForReview).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImportUploadForm' }
            encoding:
              metadata:
                contentType: application/json
      responses:
        '202':
          description: Lote recibido.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/imports/{importId}:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [Imports]
      operationId: getImport
      summary: IM-03 Estado y recuentos del lote (L)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Lote.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/imports/{importId}/diffs:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      tags: [Imports]
      operationId: listImportDiffs
      summary: IM-04 Diferencias del lote (L)
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/DiffKind' }
        - name: requiresDecision
          in: query
          schema: { type: boolean }
        - name: decision
          in: query
          schema: { $ref: '#/components/schemas/DiffDecision' }
        - name: applyStatus
          in: query
          schema: { $ref: '#/components/schemas/DiffApplyStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de diferencias.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportDiffPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/imports/{importId}/diff-decisions:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Imports]
      operationId: decideImportDiffs
      summary: IM-05 Decide en bloque Accept o Exclude por diferencia (A)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiffDecisionsRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/imports/{importId}/approve:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    post:
      tags: [Imports]
      operationId: approveImport
      summary: IM-06 Aprueba el lote; la aplicación sigue en segundo plano (A)
      description: Exige todas las diferencias con requiresDecision decididas (409 geo.import.not_reviewed) y canónico sin cambios (409 geo.import.stale).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/OptionalReason' }
      responses:
        '202':
          description: Lote aprobado; pasa a Applying.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/imports/{importId}/reject:
    parameters:
      - $ref: '#/components/parameters/ImportId'
