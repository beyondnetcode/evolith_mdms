openapi: 3.1.0
info:
  title: MDM — geografía de la suite (Geography)
  version: 0.1.0
  summary: Contrato API-MDM-003 de mdm-api para países, lugares, códigos oficiales, sucesiones, comercio exterior, zonas postales, importaciones, esquemas y fuentes.
  description: |
    Documento máquina del contrato `API-MDM-003` (Borrador, sin implementación).
    La prosa y el porqué de cada regla están en `contrato-api-geografia-mdm-003.es.md`;
    el modelo de datos en `MD-MDM-003`. Deriva de PRD-MDM-002, ADR-MDM-002 (Borrador)
    y ADR-0266 (Aceptado). Es la fuente del mock del frontend.

    Concurrencia: toda escritura sobre un recurso existente exige `If-Match` con la
    versión del agregado dueño (GeoPlace, CountryTerritorialSchema, CodeScheme,
    CodeCorrespondence, Succession, PostalZone, ImportBatch o SourceLicense).
    Nombres, códigos y funciones comparten la versión de su lugar.

    Permisos (SUPUESTO, G-622): L = geo.read, M = geo.maintain, A = geo.approve.
    Datos con licencia InternalOnly se omiten para clientes de distribución externa (G-623).
  contact:
    name: Organización S.A.
  license:
    name: Propietaria — © Organización S.A.
    identifier: LicenseRef-Organización-Proprietary
servers:
  - url: /api/v1
    description: Prefijo común de mdm-api
security:
  - umsBearer: []
tags:
  - name: Countries
    description: Países (lugar de tipo Country) y su política territorial (agregado aparte)
  - name: Places
    description: Agregado GeoPlace, búsqueda, resolución por código y vistas
  - name: Codes
    description: Códigos oficiales del lugar (versión del lugar)
  - name: Correspondences
    description: Agregado CodeCorrespondence (versión propia)
  - name: Successions
    description: Agregado Succession con revisión de direcciones afectadas
  - name: TradeLocations
    description: Lugares UN/LOCODE y lugares propios ORG-SITE (son GeoPlace)
  - name: PostalZones
    description: Agregado PostalZone con relación M:N a lugares
  - name: Imports
    description: Agregado ImportBatch en tres capas (aterrizaje, diferencias, canónico)
  - name: Catalogs
    description: Esquemas de código y fuentes con su licencia

paths:
  /geo/countries:
    get:
      tags: [Countries]
      operationId: listCountries
      summary: CO-01 Lista completa de países (L)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PlaceStatus' }
        - name: search
          in: query
          description: Nombre normalizado o código ISO; no se registra en logs.
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Todos los países, sin paginar.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountryList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Countries]
      operationId: registerCountry
      summary: CO-02 Alta de un país con sus tres códigos ISO 3166-1 (A)
      description: Crea el lugar de tipo Country; no exige If-Match. Evento GeoPlaceEvent (Created).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCountryRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/countries/{countryCode}:
    parameters:
      - $ref: '#/components/parameters/CountryCodePath'
    get:
      tags: [Countries]
      operationId: getCountry
      summary: CO-03 Ficha del país (L)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: País con códigos y resumen de su escalera.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Country' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Countries]
      operationId: updateCountry
      summary: CO-04 Cambia officialName y englishName (A)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCountryRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/countries/{countryCode}/territorial-schema:
    parameters:
      - $ref: '#/components/parameters/CountryCodePath'
    get:
      tags: [Countries]
      operationId: getTerritorialSchema
      summary: CO-05 Escalera de niveles y política postal (L)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Política territorial del país.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerritorialSchema' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Countries]
      operationId: putTerritorialSchema
      summary: CO-06 Declara o cambia la escalera y la política postal (A)
      description: If-None-Match * declara (201); If-Match cambia (204). Sin ninguna → 428. Evento CountryTerritorialSchemaChanged.
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
        - $ref: '#/components/parameters/IfNoneMatchCreate'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TerritorialSchemaInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places:
    get:
      tags: [Places]
      operationId: searchPlaces
      summary: PL-01 Búsqueda de lugares (L)
      parameters:
        - name: name
          in: query
          description: Texto normalizado (sin tildes ni mayúsculas) sobre todos los nombres vigentes. No se registra en logs.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: nameMatch
          in: query
          description: contains exige countryCode o parentId (400 validation.search_too_broad).
          schema:
            type: string
            enum: [prefix, contains]
            default: prefix
        - name: scheme
          in: query
          schema: { $ref: '#/components/schemas/SchemeCode' }
        - name: code
          in: query
          schema: { $ref: '#/components/schemas/CodeValue' }
        - name: pathPrefix
          in: query
          schema: { type: string, maxLength: 400, examples: [PE/15/] }
        - name: parentId
          in: query
          schema: { type: string, format: uuid }
        - name: countryCode
          in: query
          schema: { $ref: '#/components/schemas/CountryCode' }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/PlaceType' }
        - name: level
          in: query
          description: Solo con countryCode.
          schema: { type: integer, minimum: 0, maximum: 6 }
        - name: status
          in: query
          description: Repetible. Ausente, Active e Inactive.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/PlaceStatus' }
        - name: usableForAddresses
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/AsOf'
        - name: view
          in: query
          schema:
            type: string
            enum: [minimal, path]
            default: minimal
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, path, updatedAt]
            default: name
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de lugares con su ruta legible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlacePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Places]
      operationId: registerPlace
      summary: PL-03 Alta de una división administrativa (M)
      description: Lee el padre sin escribirlo; no exige If-Match. Evento GeoPlaceEvent (Created).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPlaceRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/resolve:
    get:
      tags: [Places]
      operationId: resolvePlaceByCode
      summary: PL-02 Resuelve un código exacto a un lugar (L)
      description: Encuentra códigos vencidos y lugares inactivos o históricos; devuelve los sucesores. Sin scheme y con varios esquemas → 409 geo.code.ambiguous.
      parameters:
        - name: value
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CodeValue' }
        - name: scheme
          in: query
          schema: { $ref: '#/components/schemas/SchemeCode' }
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: Lugar resuelto con el detalle de la resolución.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceResolution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    get:
      tags: [Places]
      operationId: getPlace
      summary: PL-04 Ficha del lugar con vista minimal, path o full (L)
      parameters:
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Lugar.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
              example:
                id: 3f2b6c1e-0a4d-4e8b-9c71-5d2a8e150101
                type: AdministrativeDivision
                status: Active
                countryCode: PE
                level: 3
                levelLabel: Distrito
                officialName: Lima
                canonicalCode: { schemeCode: UBIGEO-INEI, value: '150101' }
                parentId: 3f2b6c1e-0a4d-4e8b-9c71-5d2a8e6f1501
                path: PE/15/1501/150101
                displayPath: Lima › Lima › Lima › Perú
                ancestors:
                  - { id: 3f2b6c1e-0a4d-4e8b-9c71-5d2a8e6f1b01, type: Country, level: 0, officialName: Perú, canonicalCode: { schemeCode: ISO-3166-1-A2, value: PE } }
                  - { id: 3f2b6c1e-0a4d-4e8b-9c71-5d2a8e6f1b15, type: AdministrativeDivision, level: 1, officialName: Lima, canonicalCode: { schemeCode: UBIGEO-INEI, value: '15' } }
                  - { id: 3f2b6c1e-0a4d-4e8b-9c71-5d2a8e6f1501, type: AdministrativeDivision, level: 2, officialName: Lima, canonicalCode: { schemeCode: UBIGEO-INEI, value: '1501' } }
                validFrom: '1821-01-01'
                validTo: null
                isCurrent: true
                version: 3
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}/official-name:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    put:
      tags: [Places]
      operationId: correctOfficialName
      summary: PL-05 Corrige el nombre oficial en un idioma (M)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectOfficialNameRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}/names:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    get:
      tags: [Places]
      operationId: listPlaceNames
      summary: PL-06 Nombres del lugar (L)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Nombres oficiales, alternativos e históricos.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceNameList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Places]
      operationId: addPlaceName
      summary: PL-07 Añade un nombre no oficial (M)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddNameRequest' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}/names/{nameId}/expire:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
      - $ref: '#/components/parameters/NameId'
    post:
      tags: [Places]
      operationId: expirePlaceName
      summary: PL-08 Vence un nombre no oficial (M)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/OptionalExpire' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    post:
      tags: [Places]
      operationId: deactivatePlace
      summary: PL-09 Desactiva un lugar (reversible) (M)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/OptionalReason' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    post:
      tags: [Places]
      operationId: reactivatePlace
      summary: PL-10 Reactiva un lugar Inactive (M)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/OptionalReason' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}/history:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    get:
      tags: [Places]
      operationId: getPlaceHistory
      summary: PL-11 Histórico del lugar (L)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Bitácora de cambios y sucesiones en que participa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}/move:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    post:
      tags: [Places]
      operationId: movePlace
      summary: PL-12 Reubica el padre para corregir un error de carga; solo hojas (A)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovePlaceRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}/geo-reference:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    put:
      tags: [Places]
      operationId: putGeoReference
      summary: PL-13 Fija o corrige el punto de referencia WGS 84 (M)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeoReferenceInput' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /geo/places/{placeId}/codes:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    get:
      tags: [Codes]
      operationId: listPlaceCodes
      summary: CD-01 Códigos del lugar, vigentes y vencidos (L)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Códigos con autoridad, fuente y licencia.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialCodeList' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
